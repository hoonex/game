name: Casual Drive

on:
  push:
    branches:
      - feat/casual-driving-game
    paths:
      - "casual-driving-game/**"
      - ".github/workflows/casual-driving-game.yml"
  pull_request:
    paths:
      - "casual-driving-game/**"
      - ".github/workflows/casual-driving-game.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: casual-driving-game

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build portable Windows game
        run: npm run dist:win

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: CasualDrive-win-x64
          path: casual-driving-game/release/CasualDrive-0.1.0-win-x64.exe

      - name: Publish direct-download release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "casual-drive-v0.1.0"
          $exe = "release/CasualDrive-0.1.0-win-x64.exe"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Casual Drive v0.1.0" --notes "3D free-roam arcade driving game with Xbox/Gamepad and keyboard controls. Designed to test PCWheelReceiver."
          }
