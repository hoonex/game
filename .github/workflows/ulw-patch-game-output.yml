name: ULW game output patch

on:
  push:
    branches:
      - ulw/game-output-health-latency-20260902

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ulw/game-output-health-latency-20260902
          fetch-depth: 0
      - name: Apply exact receiver patches
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/ulw_patch.py
          python /tmp/ulw_patch.py
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pc-wheel-receiver/Program.cs pc-wheel-receiver/UI/MainForm.cs pc-wheel-receiver/protocol.json
          git commit -m 'fix(pc-wheel): surface game output health and sharpen low-latency defaults'
          git push origin HEAD:ulw/game-output-health-latency-20260902
